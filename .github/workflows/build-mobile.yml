name: Build Mobile Apps (Android & iOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets & Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Build Android Debug & Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: cbe-diaspora-mortgage-android-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Android AAB (for Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: cbe-diaspora-mortgage-android-aab
          path: android/app/build/outputs/bundle/release/*.aab

  build-ios:
    name: Build iOS App (Xcode / App Store)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Set up CocoaPods
        run: gem install cocoapods

      - name: Build Web Assets & Sync Capacitor
        run: |
          npm run build
          npx cap sync ios
          cd ios/App
          pod install

      - name: Resolve Swift Packages & Build Xcode Archive
        run: |
          cd ios/App
          # Modern Capacitor uses Swift Package Manager (SPM), not CocoaPods
          xcodebuild -resolvePackageDependencies -project App.xcodeproj
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA from Archive
        run: |
          cd ios/App
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build && zip -r App.ipa Payload

      - name: Upload iOS IPA & Archive (for App Store Connect / TestFlight)
        uses: actions/upload-artifact@v4
        with:
          name: cbe-diaspora-mortgage-ios-ipa
          path: |
            ios/App/build/App.ipa
            ios/App/build/App.xcarchive

